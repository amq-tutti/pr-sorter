name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - "pr-sorter/**"
  delete:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-sorter:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref_name, 'pr-sorter/')
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}

      - name: Compute slug
        id: slug
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME#pr-sorter/}"
          slug="$(printf '%s' "$branch" | tr '/[:upper:]' '-[:lower:]' | tr -cd 'a-z0-9._-')"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Write meta.json
        run: |
          node .github/scripts/write-meta.mjs "${{ steps.slug.outputs.slug }}"
          cp customize/favicon.ico dist/favicon.ico

      - uses: actions/upload-artifact@v4
        with:
          name: sorter-${{ steps.slug.outputs.slug }}
          path: dist/
          retention-days: 1

  deploy-sorter:
    needs: build-sorter
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref_name, 'pr-sorter/')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sorter-${{ needs.build-sorter.outputs.slug }}
          path: dist/

      - name: Deploy sorter
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          destination_dir: ${{ needs.build-sorter.outputs.slug }}
          keep_files: true

  cleanup-sorter:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'pr-sorter/')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Compute slug
        id: slug
        shell: bash
        run: |
          branch="${{ github.event.ref }}"
          branch="${branch#pr-sorter/}"
          slug="$(printf '%s' "$branch" | tr '/[:upper:]' '-[:lower:]' | tr -cd 'a-z0-9._-')"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Remove sorter from gh-pages
        shell: bash
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          if [ -d "/tmp/gh-pages/${{ steps.slug.outputs.slug }}" ]; then
            cd /tmp/gh-pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git rm -rf "${{ steps.slug.outputs.slug }}"
            git commit -m "Remove sorter: ${{ steps.slug.outputs.slug }}"
            git push origin HEAD:gh-pages
          fi

  update-homepage:
    needs: [deploy-sorter, cleanup-sorter]
    concurrency:
      group: pages-homepage
      cancel-in-progress: false
    if: |
      always() &&
      (
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || startsWith(github.ref_name, 'pr-sorter/')) ||
        (github.event_name == 'delete' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'pr-sorter/'))
      ) &&
      (needs.deploy-sorter.result == 'success' || needs.deploy-sorter.result == 'skipped') &&
      (needs.cleanup-sorter.result == 'success' || needs.cleanup-sorter.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate homepage
        run: |
          mkdir -p homepage-dist gh-pages-content
          git fetch origin gh-pages || true
          if git rev-parse origin/gh-pages >/dev/null 2>&1; then
            git ls-tree -r origin/gh-pages --name-only | grep '/meta\.json$' | while IFS= read -r f; do
              mkdir -p "gh-pages-content/$(dirname "$f")"
              git show "origin/gh-pages:$f" > "gh-pages-content/$f"
            done
          fi
          git fetch origin main
          git show origin/main:customize/favicon.ico > homepage-dist/favicon.ico
          node .github/scripts/generate-homepage.mjs gh-pages-content homepage-dist/index.html

      - name: Deploy homepage
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: homepage-dist
          keep_files: true
