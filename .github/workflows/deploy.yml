name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - "pr-sorter/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-sorter:
    if: startsWith(github.ref_name, 'pr-sorter/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}

      - name: Compute slug
        id: slug
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME#pr-sorter/}"
          slug="$(printf '%s' "$branch" | tr '/[:upper:]' '-[:lower:]' | tr -cd 'a-z0-9._-')"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Write meta.json
        run: |
          node .github/scripts/write-meta.mjs "${{ steps.slug.outputs.slug }}"
          cp customize/favicon.ico dist/favicon.ico

      - name: Deploy sorter
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          destination_dir: ${{ steps.slug.outputs.slug }}
          keep_files: true

  update-homepage:
    needs: deploy-sorter
    if: |
      always() &&
      (github.ref_name == 'main' || startsWith(github.ref_name, 'pr-sorter/')) &&
      (needs.deploy-sorter.result == 'success' || needs.deploy-sorter.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate homepage
        run: |
          mkdir -p homepage-dist gh-pages-content
          git fetch origin gh-pages || true
          if git rev-parse origin/gh-pages >/dev/null 2>&1; then
            git ls-tree -r origin/gh-pages --name-only | grep '/meta\.json$' | while IFS= read -r f; do
              mkdir -p "gh-pages-content/$(dirname "$f")"
              git show "origin/gh-pages:$f" > "gh-pages-content/$f"
            done
          fi
          git fetch origin main
          git show origin/main:customize/favicon.ico > homepage-dist/favicon.ico
          node .github/scripts/generate-homepage.mjs gh-pages-content homepage-dist/index.html

      - name: Deploy homepage
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: homepage-dist
          keep_files: true
